<div class="contact-page">
  <div class="contact-overview">
    <p class="eyebrow">Get in touch</p>
    <h1>Contact our support team</h1>
    <p>
      Have a question about the employee portal or need help with setup?
      Send us a message and our team will get back to you quickly.
    </p>

    <div class="contact-details">
      <div>
        <strong>Email</strong>
        <p>support@employeeapp.com</p>
      </div>
      <div>
        <strong>Phone</strong>
        <p>+1 (800) 123-4567</p>
      </div>
      <div>
        <strong>Office</strong>
        <p>123 Corporate Blvd, Suite 900</p>
      </div>
    </div>
  </div>

  <div class="contact-card">
    <h2>Send a message</h2>
    <form>
      <label>
        Name
        <input type="text" placeholder="Your name" />
      </label>
      <label>
        Email
        <input type="email" placeholder="Your email" />
      </label>
      <label>
        Message
        <textarea rows="6" placeholder="Describe your request"></textarea>
      </label>
      <button type="button" class="btn btn-primary">Send Message</button>
    </form>
  </div>
</div>
