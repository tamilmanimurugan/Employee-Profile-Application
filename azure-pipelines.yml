# ============================================================
# Azure DevOps CI/CD Pipeline — Angular Web App
# Deploys: Angular Web App → employeeprofileweb (App Service)
# Trigger: push to main branch
# ============================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  webAppName: 'employeeprofileweb'
  nodeVersion: '20.x'

stages:

- stage: BuildAndDeployWeb
  displayName: 'Build & Deploy Angular Web App'
  jobs:

  - job: BuildWeb
    displayName: 'Build Angular'
    steps:

    - task: NodeTool@0
      displayName: 'Install Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Npm@1
      displayName: 'npm install'
      inputs:
        command: 'install'
        workingDir: '.'

    - task: Npm@1
      displayName: 'ng build --configuration production'
      inputs:
        command: 'custom'
        workingDir: '.'
        customCommand: 'run build -- --configuration production'

    - task: PublishBuildArtifacts@1
      displayName: 'Upload Web artifact'
      inputs:
        PathtoPublish: 'dist/Employee_profile/browser'
        ArtifactName: 'web-drop'

  - job: DeployWeb
    displayName: 'Deploy Web to Azure'
    dependsOn: BuildWeb
    steps:

    - task: DownloadBuildArtifacts@1
      inputs:
        artifactName: 'web-drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Deploy Web → employeeprofileweb'
      inputs:
        azureSubscription: 'EmployeeProfileManagementServiceConnection'
        appType: 'webApp'
        appName: '$(webAppName)'
        package: '$(System.ArtifactsDirectory)/web-drop'
        deploymentMethod: 'auto'
