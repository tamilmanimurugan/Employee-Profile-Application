# ============================================================
# Azure DevOps CI/CD Pipeline — Angular Web App
# Deploys: Angular Web App → employeeprofileweb (App Service)
# Trigger: push to main branch
# ============================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  webAppName: 'employeeprofileweb'

stages:

- stage: BuildAndDeployWeb
  displayName: 'Build & Deploy Angular Web App'
  jobs:

  - job: BuildWeb
    displayName: 'Build Angular'
    steps:

    - task: NodeTool@0
      displayName: 'Install Node.js 22.x'
      inputs:
        versionSpec: '22.x'
        checkLatest: true

    - script: |
        node --version
        npm --version
      displayName: 'Verify Node version'

    - script: npm install
      displayName: 'npm install'

    - script: node ./node_modules/@angular/cli/bin/ng.js build --configuration production
      displayName: 'ng build (production)'

    - script: |
        echo "=== dist output ==="
        find dist -maxdepth 3 | sort
      displayName: 'Show dist structure'
      condition: succeeded()

    - task: PublishBuildArtifacts@1
      displayName: 'Upload Web artifact'
      inputs:
        PathtoPublish: 'dist/Employee_profile/browser'
        ArtifactName: 'web-drop'

  - job: DeployWeb
    displayName: 'Deploy Web to Azure'
    dependsOn: BuildWeb
    steps:

    - task: DownloadBuildArtifacts@1
      inputs:
        artifactName: 'web-drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Deploy Web → employeeprofileweb'
      inputs:
        azureSubscription: 'EmployeeProfileManagementServiceConnection'
        appType: 'webApp'
        appName: '$(webAppName)'
        package: '$(System.ArtifactsDirectory)/web-drop'
        deploymentMethod: 'auto'
